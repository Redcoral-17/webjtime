services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webjtime
      POSTGRES_USER: webjtime
      POSTGRES_PASSWORD: webjtime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webjtime"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/webjtime
      DATABASE_USERNAME: webjtime
      DATABASE_PASSWORD: webjtime
      ADMIN_USERNAME: red_coral
      ADMIN_PASSWORD: Fico@#6013
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: